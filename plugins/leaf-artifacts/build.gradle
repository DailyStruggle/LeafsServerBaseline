plugins {
    id 'java'
}

group = 'net.leaf'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    // LeafArtifacts depends on the LeafCurios API (separate plugin module).
    compileOnly files('../leaf-curios/build/libs/LeafCurios-0.1.0.jar')

    // Tests: paper-api is needed on the test classpath because ArtifactLoot's
    // static init references org.bukkit.entity.EntityType constants.
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Match the Maven finalName (LeafArtifacts-0.1.0.jar) so deploy docs stay accurate.
tasks.named('jar') {
    archiveBaseName = 'LeafArtifacts'
    archiveVersion = '0.1.0'
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 21
}
