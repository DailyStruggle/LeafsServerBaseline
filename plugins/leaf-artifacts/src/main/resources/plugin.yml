name: LeafArtifacts
version: 0.1.0
main: net.leaf.artifacts.LeafArtifactsPlugin
api-version: '1.21'
author: Leaf
description: Exploration artifacts (wearable trinkets) recreated with vanilla mechanics.
folia-supported: true
depend: [LeafCurios]
commands:
  artifact:
    description: Open the artifact equipment menu; /artifact give <type> [player] for admins.
    usage: /artifact [give <type> [player]]
    permission: leafartifacts.use
permissions:
  leafartifacts.admin:
    description: Use the /artifact management command.
    default: op
  leafartifacts.use:
    description: Benefit from artifacts carried in the inventory.
    default: true
