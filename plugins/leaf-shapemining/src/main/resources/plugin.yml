name: LeafShapeMining
version: 0.1.0
main: net.leaf.shapemining.LeafShapeMiningPlugin
api-version: '1.21'
author: Leaf
description: Vanilla/Folia-safe shape-mining (Excavate / tunnel-bore style) tool.
folia-supported: true
commands:
  shapemine:
    description: Toggle shape/vein mining for yourself; /shapemine [on|off].
    usage: /shapemine [on|off]
    permission: leafshapemining.use
permissions:
  leafshapemining.use:
    description: Use shape/vein mining.
    default: true
